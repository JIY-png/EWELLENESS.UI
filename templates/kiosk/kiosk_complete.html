{% extends "layouts/kiosk_base.html" %}

{% block content %}
<section class="complete-kiosk-page">
    <div class="complete-kiosk-card">
        <div class="complete-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <p class="complete-brand">E-WELLNESS</p>

        <h1>Assessment Complete</h1>

        <p>
            Your health record has been saved successfully.
        </p>

        <p class="complete-note">
            If your result needs attention, please proceed to the assigned health personnel for assistance.
        </p>

        <a href="{{ url_for('kiosk_welcome_page') }}" class="complete-primary-btn">
            Done
        </a>
    </div>
</section>
{% endblock %}

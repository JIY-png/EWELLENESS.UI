{% extends "layouts/kiosk_base.html" %}

{% block content %}
<section class="kiosk-checkin-card">
    <div class="kiosk-checkin-top">
        <a href="{{ url_for('kiosk_welcome_page') }}" class="kiosk-back-link">
            ← Back
        </a>

        <div class="kiosk-checkin-brand">
            <div class="kiosk-checkin-logo">+</div>
            <span>E-WELLNESS</span>
        </div>
    </div>

    <div class="kiosk-checkin-heading">
        <h1>Patient Check-in</h1>
        <p>Enter your basic information before starting the health assessment.</p>
    </div>

    <form method="POST" class="kiosk-checkin-form">
        <div class="kiosk-form-group">
            <label>First Name</label>
            <input type="text" name="first_name" placeholder="Enter first name" required>
        </div>

        <div class="kiosk-form-group">
            <label>Last Name</label>
            <input type="text" name="last_name" placeholder="Enter last name" required>
        </div>

        <div class="kiosk-form-group">
            <label>Birth Date</label>
            <input type="text" name="birth_date" placeholder="MM/DD/YYYY" required>
        </div>

        <div class="kiosk-form-group">
            <label>Contact Number</label>
            <input type="text" name="contact_no" placeholder="09XXXXXXXXX" required>
        </div>

        <div class="kiosk-form-group kiosk-full">
            <label>Barangay</label>
            <input type="text" name="barangay" placeholder="Enter barangay" required>
        </div>

        <div class="kiosk-checkin-actions">
            <button type="submit" class="kiosk-continue-btn">
                Continue
            </button>
        </div>
    </form>
</section>
{% endblock %}
